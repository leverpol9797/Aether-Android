plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aether.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aether.client'
        minSdk 26
        targetSdk 35
        versionCode 3
        // The app's own version, independent of the core it ships. v2.3.0 was the first
        // build; this one has the real data plane, the full settings screen and the
        // protocol catalogue, which is not a republish of the same thing.
        versionName '2.4.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release APKs are signed only when the keystore secrets are present. Without them the
    // build still succeeds, but the artifacts are -unsigned and cannot be installed --
    // which is the honest outcome. An unsigned release nobody can install beats one signed
    // with a key committed to the repository.
    signingConfigs {
        release {
            def store = System.getenv("AETHER_KEYSTORE")
            if (store && new File(store).exists()) {
                storeFile file(store)
                storePassword System.getenv("AETHER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AETHER_KEY_ALIAS")
                keyPassword System.getenv("AETHER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def store = System.getenv("AETHER_KEYSTORE")
            if (store && new File(store).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The core ships as one ELF executable per ABI under jniLibs. Splitting keeps a
    // device from carrying two or three copies of a binary it can never execute,
    // and the universal APK stays for sideloading where the ABI is not known yet.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

android {
    // Referenced by the About screen. Without it the field silently does not exist and
    // the compile fails at the use site rather than here.
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    // org.json is stubbed inside android.jar, so JVM unit tests need the real one.
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
