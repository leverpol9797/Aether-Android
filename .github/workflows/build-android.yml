name: Build Aether-Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The core is not vendored in git: it is fetched from the upstream release and
      # checked against the .sha256 sidecar that release publishes, so a corrupted or
      # substituted archive fails the build instead of shipping inside the APK.
      - name: Fetch and verify the Aether v2.3.0 core binaries
        env:
          CORE_VERSION: v2.3.0
        run: |
          set -euo pipefail
          base="https://github.com/CluvexStudio/Aether/releases/download/${CORE_VERSION}"
          tmp="$(mktemp -d)"

          for spec in \
            "arm64-v8a aether-android-arm64.tar.gz" \
            "armeabi-v7a aether-android-armv7.tar.gz" \
            "x86_64 aether-android-x86_64.tar.gz"
          do
            set -- $spec
            abi="$1"; archive="$2"
            dest="app/src/main/jniLibs/${abi}"
            mkdir -p "$dest"

            curl -fsSL "$base/$archive" -o "$tmp/$archive"
            curl -fsSL "$base/$archive.sha256" -o "$tmp/$archive.sha256"

            # The sidecar is "<hash>  <filename>" or a bare hash; both are accepted.
            expected="$(awk '{print $1; exit}' "$tmp/$archive.sha256")"
            actual="$(sha256sum "$tmp/$archive" | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::${archive} failed its SHA-256 check (expected ${expected}, got ${actual})"
              exit 1
            fi
            echo "${archive}: sha256 ok (${actual})"

            tar -xzf "$tmp/$archive" -C "$tmp"
            core="$(find "$tmp" -type f -name aether | head -n 1)"
            test -n "$core"
            # An ELF executable shipped as a .so: the loader never maps it as a
            # library, it is extracted and run directly, so the name is only a
            # packaging convention.
            cp "$core" "$dest/libaether.so"
          done

          rm -rf "$tmp"
          find app/src/main/jniLibs -name 'libaether.so' -exec ls -la {} \;

      # The packet tunnel. The Aether core publishes a SOCKS5 listener; something has to
      # speak IP to the Android TUN descriptor and speak SOCKS5 on the other side. That is
      # hev-socks5-tunnel, and without this library the app builds and installs fine but
      # Device VPN mode can never work -- so it is built here rather than assumed.
      - name: Build the hev-socks5-tunnel packet bridge
        run: |
          set -euo pipefail
          NDK_BUILD="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" -name ndk-build 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK_BUILD" ]; then
            echo "::error::ndk-build was not found; the packet bridge cannot be built"
            exit 1
          fi
          echo "Using ndk-build: $NDK_BUILD"

          work="$(mktemp -d)"
          # Pinned to 2.16.0: the JNI symbols this app calls (TProxyStartService,
          # TProxyStopService, TProxyGetStats) are that version's contract.
          git clone --quiet --branch 2.16.0 --depth 1 --recurse-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git "$work/hev"

          "$NDK_BUILD" \
            NDK_PROJECT_PATH="$work/hev" \
            APP_BUILD_SCRIPT="$work/hev/Android.mk" \
            NDK_APPLICATION_MK="$work/hev/Application.mk" \
            'APP_ABI=armeabi-v7a arm64-v8a x86_64' \
            'APP_CFLAGS=-O3 -DPKGNAME=com/aether/client/tun' \
            NDK_LIBS_OUT="$work/libs" NDK_OUT="$work/obj" -j4

          for abi in armeabi-v7a arm64-v8a x86_64; do
            test -f "$work/libs/$abi/libhev-socks5-tunnel.so"
            cp "$work/libs/$abi/libhev-socks5-tunnel.so" "app/src/main/jniLibs/$abi/"
          done
          rm -rf "$work"
          find app/src/main/jniLibs -name 'libhev-socks5-tunnel.so' -exec ls -la {} \;

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APKs (per-ABI + universal)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          version="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          out="dist"
          mkdir -p "$out"
          find app/build/outputs/apk -name '*.apk' -print | while read -r apk; do
            base="$(basename "$apk")"
            cp "$apk" "$out/AetherAndroid-v${version}-${base}"
          done
          ls -la "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Android-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::${tag} already exists; bump versionName in app/build.gradle instead of re-publishing the same tag"
            exit 1
          fi
          gh release create "$tag" dist/*.apk \
            --title "Aether Android v${version}" \
            --generate-notes