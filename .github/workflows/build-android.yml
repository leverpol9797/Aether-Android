name: Build Aether-Android Release APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Aether Core Binaries (v2.3.0)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          
          # Download official release of Aether core v1.9.0 / v2.3.0 android builds
          base='https://github.com/CluvexStudio/Aether/releases/download/v1.9.0'
          
          curl -L --fail "$base/aether-android-arm64.tar.gz" -o tmp_arm64.tar.gz || true
          if [ -f tmp_arm64.tar.gz ]; then
            tar -xzf tmp_arm64.tar.gz
            cp $(find . -type f -name aether | head -1) app/src/main/jniLibs/arm64-v8a/libaether.so || true
            rm -f tmp_arm64.tar.gz
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
